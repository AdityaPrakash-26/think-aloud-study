<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1536" height="864" fill="#f8fafc"/>
  <text x="768" y="96" text-anchor="middle" font-size="54" font-weight="700" fill="#0f172a">Why leaves change color</text>
  <g transform="translate(96,170)">
    <rect width="420" height="560" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <circle cx="210" cy="130" r="70" fill="#16a34a"/>
    <text x="210" y="270" text-anchor="middle" font-size="36" font-weight="700" fill="#14532d">Summer</text>
    <text x="210" y="330" text-anchor="middle" font-size="28" fill="#14532d">Full of chlorophyll</text>
    <text x="210" y="372" text-anchor="middle" font-size="28" fill="#14532d">(green pigment that</text>
    <text x="210" y="414" text-anchor="middle" font-size="28" fill="#14532d">captures sunlight)</text>
  </g>
  <g transform="translate(558,170)">
    <rect width="420" height="560" rx="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="210" cy="130" r="70" fill="#eab308"/>
    <text x="210" y="270" text-anchor="middle" font-size="36" font-weight="700" fill="#713f12">Shorter days</text>
    <text x="210" y="330" text-anchor="middle" font-size="28" fill="#713f12">Trees stop making</text>
    <text x="210" y="372" text-anchor="middle" font-size="28" fill="#713f12">chlorophyll; yellow and</text>
    <text x="210" y="414" text-anchor="middle" font-size="28" fill="#713f12">orange carotenoids show</text>
  </g>
  <g transform="translate(1020,170)">
    <rect width="420" height="560" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <circle cx="210" cy="130" r="70" fill="#dc2626"/>
    <text x="210" y="270" text-anchor="middle" font-size="36" font-weight="700" fill="#7f1d1d">Red leaves</text>
    <text x="210" y="330" text-anchor="middle" font-size="28" fill="#7f1d1d">Some trees make new</text>
    <text x="210" y="372" text-anchor="middle" font-size="28" fill="#7f1d1d">red anthocyanins</text>
    <text x="210" y="414" text-anchor="middle" font-size="28" fill="#7f1d1d">(e.g. maples)</text>
  </g>
  <text x="768" y="810" text-anchor="middle" font-size="26" fill="#475569">Practice image — not part of the study</text>
</svg>
