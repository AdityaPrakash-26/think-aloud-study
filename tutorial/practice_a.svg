<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 1536 864"><rect width="1536" height="864" fill="#f8fafc"/><text x="768" y="96" fill="#0f172a" font-size="54" font-weight="700" text-anchor="middle">Why leaves change color</text><g transform="translate(96,170)"><rect width="420" height="560" fill="#dcfce7" stroke="#16a34a" stroke-width="4" rx="24"/><circle cx="210" cy="130" r="70" fill="#16a34a"/><text x="210" y="270" fill="#14532d" font-size="36" font-weight="700" text-anchor="middle">Summer</text><text x="210" y="330" fill="#14532d" font-size="28" text-anchor="middle">Full of chlorophyll</text><text x="210" y="372" fill="#14532d" font-size="28" text-anchor="middle">(green pigment that</text><text x="210" y="414" fill="#14532d" font-size="28" text-anchor="middle">captures sunlight)</text></g><g transform="translate(558,170)"><rect width="420" height="560" fill="#fef9c3" stroke="#ca8a04" stroke-width="4" rx="24"/><circle cx="210" cy="130" r="70" fill="#eab308"/><text x="210" y="270" fill="#713f12" font-size="36" font-weight="700" text-anchor="middle">Shorter days</text><text x="210" y="330" fill="#713f12" font-size="28" text-anchor="middle">Trees stop making</text><text x="210" y="372" fill="#713f12" font-size="28" text-anchor="middle">chlorophyll; yellow and</text><text x="210" y="414" fill="#713f12" font-size="28" text-anchor="middle">orange carotenoids show</text></g><g transform="translate(1020,170)"><rect width="420" height="560" fill="#fee2e2" stroke="#dc2626" stroke-width="4" rx="24"/><circle cx="210" cy="130" r="70" fill="#dc2626"/><text x="210" y="270" fill="#7f1d1d" font-size="36" font-weight="700" text-anchor="middle">Red leaves</text><text x="210" y="330" fill="#7f1d1d" font-size="28" text-anchor="middle">Some trees make new</text><text x="210" y="372" fill="#7f1d1d" font-size="28" text-anchor="middle">red anthocyanins</text><text x="210" y="414" fill="#7f1d1d" font-size="28" text-anchor="middle">(e.g. maples)</text></g><text x="768" y="810" fill="#475569" font-size="26" text-anchor="middle">Practice image — not part of the study</text></svg>