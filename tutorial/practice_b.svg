<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 1536 864"><rect width="1536" height="864" fill="#f8fafc"/><text x="768" y="96" fill="#0f172a" font-size="54" font-weight="700" text-anchor="middle">Frost paints the leaves</text><g transform="translate(318,200)"><rect width="900" height="460" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" rx="24"/><text x="450" y="120" fill="#0c4a6e" font-size="40" font-weight="700" text-anchor="middle">Cold weather → leaves freeze</text><text x="450" y="210" fill="#0c4a6e" font-size="32" text-anchor="middle">Colder nights = brighter colors</text><text x="450" y="300" fill="#0c4a6e" font-size="32" text-anchor="middle">Warm places: leaves never change</text></g><text x="768" y="810" fill="#475569" font-size="26" text-anchor="middle">Practice image — not part of the study</text></svg>